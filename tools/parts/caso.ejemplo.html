<!--
  PLANTILLA. No es una página del sitio y build.py no la publica.
  Para un caso real:
  1. Crea tools/parts/caso-<slug>.html con el mismo marco que
     tools/parts/caso-acero.html (resumen, cifras, reto,
     solución, resultados, cierre y {{FORM:...}}).
  2. Registra el slug en EXTRAS y en META, dentro de tools/build.py.
     EXTRAS no agrega el caso al menú.
  3. Agrega una tarjeta <a class="case-card"> dentro de #casos en
     tools/parts/soluciones.html.
  4. Sustituye los corchetes sólo con datos confirmados.
     No inventes cliente, sector, cita ni resultado. Si el nombre del
     cliente no está autorizado, usa el sector o el tipo de carga.
  5. python3 tools/build.py

  El artículo de abajo es sólo el esquema de la tarjeta del índice.
-->
<article class="case">
  <p class="eyebrow">[Año]</p>
  <h3 data-es="[Sector o tipo de carga]" data-en="[Sector or freight type]">[Sector o tipo de carga]</h3>
  <p><b data-es="Necesidad." data-en="Need.">Necesidad.</b> <span data-es="[Qué pedía la operación.]" data-en="[What the operation asked for.]">[Qué pedía la operación.]</span></p>
  <p><b data-es="Solución." data-en="Solution.">Solución.</b> <span data-es="[Qué diseñó CRISOSA.]" data-en="[What CRISOSA designed.]">[Qué diseñó CRISOSA.]</span></p>
  <p><b data-es="Resultado." data-en="Result.">Resultado.</b> <span data-es="[Cifra confirmada, o elimina este párrafo.]" data-en="[Confirmed figure, or delete this paragraph.]">[Cifra confirmada, o elimina este párrafo.]</span></p>
</article>
